nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['^https?://localhost(:[0-9]+)?$', '^https?://127\.0\.0\.1(:[0-9]+)?$', '^https://.*\.ngrok-free\.dev$', '^https://.*\.onrender\.com$']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['*']
        expose_headers: ['Authorization']
        max_age: 3600
    paths:
        '^/api/':
            allow_origin: ['*']
            allow_methods: ['POST', 'PUT', 'PATCH', 'GET', 'DELETE', 'OPTIONS']
            allow_headers: ['*']
            expose_headers: ['Authorization']
            max_age: 3600